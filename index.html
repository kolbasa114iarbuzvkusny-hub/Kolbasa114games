<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Games</title>
    <style>
        body { font-family: monospace; background-color: #0d1117; color: #c9d1d9; padding: 30px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #58a6ff; border-bottom: 1px solid #21262d; padding-bottom: 10px; font-size: 28px; }
        p.desc { color: #8b949e; font-size: 14px; line-height: 1.5; }
        .game-list { margin-top: 30px; }
        .game-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #21262d; transition: 0.2s; }
        .game-item:hover { background: #161b22; }
        .game-info { display: flex; flex-direction: column; }
        .game-name { font-weight: bold; color: #ff7b72; font-size: 16px; }
        .game-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .play-btn { color: #58a6ff; text-decoration: none; font-weight: bold; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; background: #21262d; }
        .play-btn:hover { background: #30363d; border-color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <h1>Games</h1>
    <p class="desc">// More Games soon!<br>
    // Status: supported</p>

    <div class="game-list">

        <div class="game-item">
            <div class="game-info">
                <span class="game-name">⚔️ Animal Fight</span>
                <span class="game-meta">File size: ~22 KB | Type: Auto Battler</span>
            </div>
            <a href="Animal_Fight.html" class="play-btn" target="_blank">Play</a>
        </div>

        <div class="game-item">
            <div class="game-info">
                <span class="game-name">🔮 Balls</span>
                <span class="game-meta">File size: ~9 KB | Type: Sandbox</span>
            </div>
            <a href="Balls.html" class="play-btn" target="_blank">Play</a>
        </div>

        <div class="game-item">
            <div class="game-info">
                <span class="game-name">Click Test</span>
                <span class="game-meta">File size: ~8 KB | Type: Test</span>
            </div>
            <a href="Click_test.html" class="play-btn" target="_blank">Play</a>
        </div>
        
    </div>
</div>

</body>
</html>
