<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ball Race</title>
    <style>
        body { margin: 0; background: #0e0e0e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #game-container { flex-grow: 1; position: relative; border-right: 2px solid #333; background: #000; }
        canvas { display: block; }
        
        #ui-panel { width: 400px; padding: 15px; background: #181818; overflow-y: auto; box-sizing: border-box; }
        .section { margin-bottom: 15px; padding: 12px; background: #252525; border-radius: 8px; border: 1px solid #333; }
        h3 { margin: 0 0 10px 0; color: #00ffcc; font-size: 14px; text-transform: uppercase; }
        
        .control-group { margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; color: #888; }
        input, select { background: #111; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        .btn-save { background: #8e44ad; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn-start { background: #27ae60; color: white; border: none; padding: 15px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; width: 100%; }
        button:hover { opacity: 0.8; }

        .battle-setup { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #111; padding: 10px; border-radius: 5px; }
        #win-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; pointer-events: none; text-shadow: 0 0 20px #000; display: none; text-align: center; width: 100%; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="arena"></canvas>
    <div id="win-msg"></div>
</div>

<div id="ui-panel">
    <div class="section">
        <h3>1. Ball Creator</h3>
        <div class="control-group">
            <label>Ball name:</label>
            <input type="text" id="edName" value="Mega Destroyer">
        </div>
        <div class="control-group">
            <label>Color:</label>
            <input type="color" id="edColor" value="#ff0000">
        </div>
        <div class="control-group">
            <label>Start DMG | Add (+):</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="edDmg" value="10" placeholder="Урон">
                <input type="number" id="edAdd" value="1" placeholder="Прирост">
            </div>
        </div>
        <div class="control-group">
            <label>Multiplier (x) | Acceleration (x):</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="edMult" value="1.05" step="0.01">
                <input type="number" id="edSpeedUp" value="1.02" step="0.01">
            </div>
        </div>
        <button class="btn-save" onclick="saveBall()">Save</button>
    </div>

    <div class="section">
        <h3>2. Battle Choose</h3>
        <div class="battle-setup">
            <div>
                <label style="color:#ff4d4d">Left:</label>
                <select id="selLeft"></select>
            </div>
            <div>
                <label style="color:#4d4dff">Right:</label>
                <select id="selRight"></select>
            </div>
        </div>
    </div>

    <div class="section">
        <h3>3. Side Health (3 on side)</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
                <input type="number" id="hpL1" value="100" style="margin-bottom:2px">
                <input type="number" id="hpL2" value="500" style="margin-bottom:2px">
                <input type="number" id="hpL3" value="1000">
            </div>
            <div>
                <input type="number" id="hpR1" value="100" style="margin-bottom:2px">
                <input type="number" id="hpR2" value="500" style="margin-bottom:2px">
                <input type="number" id="hpR3" value="1000">
            </div>
        </div>
    </div>

    <button class="btn-start" onclick="startRace()">В БОЙ!</button>
</div>

<script>
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
let savedBalls = JSON.parse(localStorage.getItem('myBalls')) || [
    {name: "Standart", color: "#ffffff", dmg: 10, add: 1, mult: 1.02, speedUp: 1.01},
    {name: "Hard", color: "#f1c40f", dmg: 50, add: 0, mult: 1.0, speedUp: 1.0}
];

let walls = [], balls = [], active = false;

function updateSelects() {
    const selects = [document.getElementById('selLeft'), document.getElementById('selRight')];
    selects.forEach(s => {
        s.innerHTML = savedBalls.map((b, i) => `<option value="${i}">${b.name}</option>`).join('');
    });
}

function saveBall() {
    const ball = {
        name: document.getElementById('edName').value,
        color: document.getElementById('edColor').value,
        dmg: parseFloat(document.getElementById('edDmg').value),
        add: parseFloat(document.getElementById('edAdd').value),
        mult: parseFloat(document.getElementById('edMult').value),
        speedUp: parseFloat(document.getElementById('edSpeedUp').value)
    };
    savedBalls.push(ball);
    localStorage.setItem('myBalls', JSON.stringify(savedBalls));
    updateSelects();
    alert("Ball Saved!");
}

function startRace() {
    const w = canvas.width = window.innerWidth - 400;
    const h = canvas.height = window.innerHeight;
    document.getElementById('win-msg').style.display = 'none';

    walls = [];
    for(let i=0; i<3; i++) {
        const hL = parseFloat(document.getElementById(`hpL${i+1}`).value);
        const hR = parseFloat(document.getElementById(`hpR${i+1}`).value);
        walls.push({x: 0, y: h*(0.25+i*0.2), w: w/2-5, h: 30, hp: hL, max: hL, side: 0});
        walls.push({x: w/2+5, y: h*(0.25+i*0.2), w: w/2-5, h: 30, hp: hR, max: hR, side: 1});
    }

    const bL = savedBalls[document.getElementById('selLeft').value];
    const bR = savedBalls[document.getElementById('selRight').value];
    
    balls = [
        {...bL, x: w*0.25, y: 50, vx: 4, vy: 6, side: 0},
        {...bR, x: w*0.75, y: 50, vx: -4, vy: 6, side: 1}
    ];
    active = true;
}

function animate() {
    if(active) {
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(0,0,canvas.width, canvas.height);

        ctx.fillStyle = "#333";
        ctx.fillRect(canvas.width/2-2, 0, 4, canvas.height);

        walls.forEach(wall => {
            if(wall.hp <= 0) return;
            ctx.fillStyle = `hsl(${Math.max(0, (wall.hp/wall.max)*120)}, 70%, 50%)`;
            ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
            ctx.fillStyle = "#fff";
            ctx.fillText(Math.ceil(wall.hp), wall.x + wall.w/2 - 10, wall.y + 20);
        });

        balls.forEach(b => {
            b.x += b.vx; b.y += b.vy;
            const limitL = b.side === 0 ? 0 : canvas.width/2 + 5;
            const limitR = b.side === 0 ? canvas.width/2 - 5 : canvas.width;

            if(b.x < limitL || b.x > limitR) b.vx *= -1;
            if(b.y < 0) b.vy *= -1;
            if(b.y > canvas.height) {
                active = false;
                const win = document.getElementById('win-msg');
                win.innerHTML = `<span style="color:${b.color}">${b.name.toUpperCase()}</span> ВЫИГРАЛ!`;
                win.style.display = 'block';
            }

            walls.forEach(w => {
                if(w.hp > 0 && w.side === b.side && b.x > w.x && b.x < w.x+w.w && b.y > w.y && b.y < w.y+w.h) {
                    b.vy *= -1;
                    w.hp -= b.dmg;
                    b.dmg = (b.dmg + b.add) * b.mult;
                    b.vx *= b.speedUp; b.vy *= b.speedUp;
                }
            });

            ctx.beginPath();
            ctx.arc(b.x, b.y, 10, 0, Math.PI*2);
            ctx.fillStyle = b.color;
            ctx.fill();
        });
    }
    requestAnimationFrame(animate);
}

updateSelects();
animate();
</script>
</body>
</html>
